name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: /bin/zsh -n bootstrap/macos.sh
      - run: /bin/zsh bootstrap/macos.sh inspect

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell entrypoint
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path bootstrap/windows.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
          }
      - name: Inspect without writes
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File bootstrap/windows.ps1 Inspect

