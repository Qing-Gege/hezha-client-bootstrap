name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: /bin/zsh -n bootstrap/macos.sh
      - run: /bin/zsh bootstrap/macos.sh inspect

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell entrypoint
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path bootstrap/windows.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
          }
      - name: Inspect without writes
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File bootstrap/windows.ps1 Inspect
      - name: Preserve native stderr and respect native exit codes
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Windows PowerShell 5.1 is required for this regression"
          }
          . ./bootstrap/windows.ps1 Inspect | Out-Null
          $output = @(
            Invoke-Captured `
              -Executable "$env:SystemRoot\System32\cmd.exe" `
              -Arguments @("/d", "/c", "echo simulated success 1>&2 & exit /b 0")
          )
          if ($output.Count -ne 1 -or $output[0].Trim() -ne "simulated success") {
            throw "native stderr output was not captured"
          }
          $failed = $false
          try {
            Invoke-Captured `
              -Executable "$env:SystemRoot\System32\cmd.exe" `
              -Arguments @("/d", "/c", "echo simulated failure 1>&2 & exit /b 23")
          }
          catch {
            $failed = $true
            if ($_.Exception.Message -ne "command failed with exit code 23") {
              throw
            }
          }
          finally {
            $global:LASTEXITCODE = 0
          }
          if (-not $failed) {
            throw "non-zero native exit code was accepted"
          }
      - name: Verify pinned Windows OfficeCLI behavior
        shell: powershell
        run: |
          . ./bootstrap/windows.ps1 Inspect | Out-Null
          $path = Join-Path $env:RUNNER_TEMP "officecli-win-x64.exe"
          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri "https://github.com/iOfficeAI/OfficeCLI/releases/download/v1.0.143/officecli-win-x64.exe" `
            -OutFile $path
          if ((Get-Item -LiteralPath $path).Length -ne 33357736) {
            throw "OfficeCLI size mismatch"
          }
          if ((Get-Sha256 -Path $path) -ne "d4d4c10fced307e209744cf98a56b003a6e613424fd651b08469274704afd2c6") {
            throw "OfficeCLI SHA-256 mismatch"
          }
          $reported = Get-FirstCapturedLine `
            -Executable $path `
            -Arguments @("--version") `
            -Label "OfficeCLI --version"
          $version = Get-ReportedVersion -Output $reported
          if ($null -eq $version -or $version -lt $OfficeCliMinimumVersion) {
            throw "OfficeCLI reported incompatible version: $reported"
          }
          Write-Host "OfficeCLI reported compatible version: $reported"
          $null = Invoke-Captured -Executable $path -Arguments @("help")
      - name: Publish OfficeCLI to User PATH and restore runner state
        shell: powershell
        run: |
          . ./bootstrap/windows.ps1 Inspect | Out-Null
          $originalUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $originalProcessPath = $env:Path
          $testRoot = Join-Path $env:RUNNER_TEMP "legalskills-path-$PID"
          $script:BinDir = Join-Path $testRoot "bin"
          $script:OfficeCliCommandPath = Join-Path $script:BinDir "officecli.exe"
          $script:OfficeCliPath = Join-Path $env:RUNNER_TEMP "officecli-win-x64.exe"
          $script:OfficeCliActualVersion = Get-FirstCapturedLine `
            -Executable $script:OfficeCliPath `
            -Arguments @("--version") `
            -Label "OfficeCLI --version"
          try {
            Publish-OfficeCliCommand
            Publish-OfficeCliCommand
            if ((Get-Sha256 -Path $script:OfficeCliCommandPath) -ne (Get-Sha256 -Path $script:OfficeCliPath)) {
              throw "published OfficeCLI digest mismatch"
            }
            $resolved = (Get-Command officecli.exe -ErrorAction Stop).Source
            if ($resolved -ne $script:OfficeCliCommandPath) {
              throw "OfficeCLI did not resolve from the published user path: $resolved"
            }
            $userEntries = @(
              [Environment]::GetEnvironmentVariable("Path", "User") -split ";" |
                Where-Object { $_.TrimEnd("\") -ieq $script:BinDir.TrimEnd("\") }
            )
            if ($userEntries.Count -ne 1) {
              throw "OfficeCLI user path entry is not idempotent"
            }
          }
          finally {
            [Environment]::SetEnvironmentVariable("Path", $originalUserPath, "User")
            $env:Path = $originalProcessPath
            Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Build and install Windows x64 runtime package
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP "document-runtime-package"
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File scripts/build_windows_runtime.ps1 -OutputDirectory $output
          $zip = Join-Path $output "DocumentRuntime-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "runtime package was not built"
          }
          $extract = Join-Path $env:RUNNER_TEMP "document-runtime-extract"
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $packageRoot = Join-Path $extract "DocumentRuntime-win-x64"
          $entries = Get-ChildItem -LiteralPath $packageRoot -Force
          if (($entries | Where-Object { $_.Name -eq "DocumentRuntime-win-x64" }).Count -ne 0) {
            throw "runtime package has an unexpected nested directory"
          }
          cmd.exe /d /c call (Join-Path $packageRoot "install.cmd")
          if ($LASTEXITCODE -ne 0) {
            throw "runtime package install failed with exit code $LASTEXITCODE"
          }
          $state = Join-Path $env:LOCALAPPDATA "LegalSkills\environment.json"
          $json = Get-Content -LiteralPath $state -Raw | ConvertFrom-Json
          if ($json.status -ne "ready" -or $json.runtime_mode -ne "portable-package") {
            throw "runtime state is not ready"
          }
          if ($json.os -ne "windows" -or $json.arch -ne "x64") {
            throw "runtime state platform is incorrect"
          }
          foreach ($name in @("officecli", "pdftotext", "pdftoppm", "pdfseparate", "pdfunite", "tesseract")) {
            $command = $json.commands.$name
            if ($null -eq $command -or $command.Count -ne 1 -or -not [IO.Path]::IsPathRooted($command[0])) {
              throw "runtime command is invalid: $name"
            }
            if (-not (Test-Path -LiteralPath $command[0] -PathType Leaf)) {
              throw "runtime command is missing: $name"
            }
          }
          if (@($json.ocr_languages) -join "," -ne "eng,chi_sim,chi_tra,osd") {
            throw "runtime OCR language set is incomplete"
          }
          & $json.commands.officecli[0] --version
          if ($LASTEXITCODE -ne 0) { throw "OfficeCLI health check failed" }
          & $json.commands.officecli[0] help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "OfficeCLI help check failed" }
          Remove-Item -LiteralPath $env:LOCALAPPDATA\LegalSkills -Recurse -Force
