name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: /bin/zsh -n bootstrap/macos.sh
      - run: /bin/zsh bootstrap/macos.sh inspect

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell entrypoint
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path bootstrap/windows.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
          }
      - name: Inspect without writes
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File bootstrap/windows.ps1 Inspect
      - name: Preserve native stderr and respect native exit codes
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Windows PowerShell 5.1 is required for this regression"
          }
          . ./bootstrap/windows.ps1 Inspect | Out-Null
          $output = @(
            Invoke-Captured `
              -Executable "$env:SystemRoot\System32\cmd.exe" `
              -Arguments @("/d", "/c", "echo simulated success 1>&2 & exit /b 0")
          )
          if ($output.Count -ne 1 -or $output[0].Trim() -ne "simulated success") {
            throw "native stderr output was not captured"
          }
          $failed = $false
          try {
            Invoke-Captured `
              -Executable "$env:SystemRoot\System32\cmd.exe" `
              -Arguments @("/d", "/c", "echo simulated failure 1>&2 & exit /b 23")
          }
          catch {
            $failed = $true
            if ($_.Exception.Message -ne "command failed with exit code 23") {
              throw
            }
          }
          if (-not $failed) {
            throw "non-zero native exit code was accepted"
          }
